<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#19294c}.head{font-size:21px;font-weight:700}.body{font-size:19px;fill:#252525}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#222"/></marker></defs><text x="60" y="70" font-size="48" font-weight="bold">Design – High-Level Diagrams</text><circle cx="80" cy="119" r="13" fill="none" stroke="#ff6b25" stroke-width="4"/><circle cx="80" cy="119" r="6" fill="#ff6b25"/><text x="110" y="128" font-size="29">Process Flow with Design Methodology — IntervAI</text><rect x="60" y="190" width="205" height="190" fill="#ddd" stroke="#333" stroke-width="2"/><text x="162" y="257" text-anchor="middle" font-size="22" font-weight="bold">Stage 1</text><text x="162" y="288" text-anchor="middle" font-size="22" font-weight="bold">Candidate and Job</text><text x="162" y="319" text-anchor="middle" font-size="22" font-weight="bold">Preparation</text><rect x="300" y="190" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="300" y="190" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="442.5" y="223" text-anchor="middle">1. Candidate Context</text><text class="body" x="442.5" y="276" text-anchor="middle">Profile and career goals</text><text class="body" x="442.5" y="310" text-anchor="middle">Upload resume</text><text class="body" x="442.5" y="344" text-anchor="middle">Add target job description</text><path d="M588 285H615" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="190" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="620" y="190" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="762.5" y="223" text-anchor="middle">2. Resume Processing</text><text class="body" x="762.5" y="276" text-anchor="middle">Validate and extract text</text><text class="body" x="762.5" y="310" text-anchor="middle">Parse skills and experience</text><text class="body" x="762.5" y="344" text-anchor="middle">Save structured evidence</text><path d="M908 285H935" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="940" y="190" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="940" y="190" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="1082.5" y="223" text-anchor="middle">3. Job Analysis</text><text class="body" x="1082.5" y="276" text-anchor="middle">Extract role requirements</text><text class="body" x="1082.5" y="310" text-anchor="middle">Normalize required skills</text><text class="body" x="1082.5" y="344" text-anchor="middle">Separate preferred skills</text><path d="M1228 285H1255" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="1260" y="190" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="1260" y="190" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="1402.5" y="223" text-anchor="middle">4. Resume–Job Match</text><text class="body" x="1402.5" y="276" text-anchor="middle">Compare skills with requirements</text><text class="body" x="1402.5" y="310" text-anchor="middle">Show matches and gaps</text><text class="body" x="1402.5" y="344" text-anchor="middle">Retain supporting evidence</text><path d="M1548 285H1575" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="1580" y="190" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="1580" y="190" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="1722.5" y="223" text-anchor="middle">5. Interview Setup</text><text class="body" x="1722.5" y="276" text-anchor="middle">Select type and mode</text><text class="body" x="1722.5" y="310" text-anchor="middle">Topics, length and difficulty</text><text class="body" x="1722.5" y="344" text-anchor="middle">Choose resume / job context</text><path d="M1722 380V408H442V445" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="450" width="205" height="190" fill="#ddd" stroke="#333" stroke-width="2"/><text x="162" y="517" text-anchor="middle" font-size="22" font-weight="bold">Stage 2</text><text x="162" y="548" text-anchor="middle" font-size="22" font-weight="bold">Adaptive Interview</text><text x="162" y="579" text-anchor="middle" font-size="22" font-weight="bold">and Assessment</text><rect x="300" y="450" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="300" y="450" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="442.5" y="483" text-anchor="middle">6. Interview Planning</text><text class="body" x="442.5" y="536" text-anchor="middle">Build topic and round plan</text><text class="body" x="442.5" y="570" text-anchor="middle">Use candidate context</text><text class="body" x="442.5" y="604" text-anchor="middle">Set question budgets</text><path d="M588 545H615" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="450" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="620" y="450" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="762.5" y="483" text-anchor="middle">7. Question Generation</text><text class="body" x="762.5" y="536" text-anchor="middle">Generate contextual question</text><text class="body" x="762.5" y="570" text-anchor="middle">Apply selected difficulty</text><text class="body" x="762.5" y="604" text-anchor="middle">Show text / optional speech</text><path d="M908 545H935" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="940" y="450" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="940" y="450" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="1082.5" y="483" text-anchor="middle">8. Answer Submission</text><text class="body" x="1082.5" y="536" text-anchor="middle">Type or review voice transcript</text><text class="body" x="1082.5" y="570" text-anchor="middle">Run / submit code when needed</text><text class="body" x="1082.5" y="604" text-anchor="middle">Persist candidate response</text><path d="M1228 545H1255" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="1260" y="450" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="1260" y="450" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="1402.5" y="483" text-anchor="middle">9. Grounded Evaluation</text><text class="body" x="1402.5" y="536" text-anchor="middle">Retrieve relevant knowledge</text><text class="body" x="1402.5" y="570" text-anchor="middle">Assess answer dimensions</text><text class="body" x="1402.5" y="604" text-anchor="middle">Store feedback and evidence</text><path d="M1548 545H1575" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="1580" y="450" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="1580" y="450" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="1722.5" y="483" text-anchor="middle">10. Adaptive Decision</text><text class="body" x="1722.5" y="536" text-anchor="middle">Follow up or change topic</text><text class="body" x="1722.5" y="570" text-anchor="middle">Increase / decrease difficulty</text><text class="body" x="1722.5" y="604" text-anchor="middle">Repeat until completion</text><path d="M1722 640V668H442V705" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="710" width="205" height="190" fill="#ddd" stroke="#333" stroke-width="2"/><text x="162" y="777" text-anchor="middle" font-size="22" font-weight="bold">Stage 3</text><text x="162" y="808" text-anchor="middle" font-size="22" font-weight="bold">Learning, Guidance</text><text x="162" y="839" text-anchor="middle" font-size="22" font-weight="bold">and Reporting</text><rect x="300" y="710" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="300" y="710" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="442.5" y="743" text-anchor="middle">11. Memory and Gaps</text><text class="body" x="442.5" y="796" text-anchor="middle">Preserve assessment evidence</text><text class="body" x="442.5" y="830" text-anchor="middle">Identify weak concepts</text><text class="body" x="442.5" y="864" text-anchor="middle">Update knowledge gaps</text><path d="M588 805H615" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="710" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="620" y="710" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="762.5" y="743" text-anchor="middle">12. Learning Plan</text><text class="body" x="762.5" y="796" text-anchor="middle">Select gaps to address</text><text class="body" x="762.5" y="830" text-anchor="middle">Assign learning and practice</text><text class="body" x="762.5" y="864" text-anchor="middle">Track activity progress</text><path d="M908 805H935" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="940" y="710" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="940" y="710" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="1082.5" y="743" text-anchor="middle">13. Focused Retry</text><text class="body" x="1082.5" y="796" text-anchor="middle">Reassess selected weak areas</text><text class="body" x="1082.5" y="830" text-anchor="middle">Compare later answer evidence</text><text class="body" x="1082.5" y="864" text-anchor="middle">Update learning progress</text><path d="M1228 805H1255" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="1260" y="710" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="1260" y="710" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="1402.5" y="743" text-anchor="middle">14. Career Guidance</text><text class="body" x="1402.5" y="796" text-anchor="middle">Compare evidence with roles</text><text class="body" x="1402.5" y="830" text-anchor="middle">Explain evidence limitations</text><text class="body" x="1402.5" y="864" text-anchor="middle">Suggest next learning steps</text><path d="M1548 805H1575" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/><rect x="1580" y="710" width="285" height="190" fill="white" stroke="#333" stroke-width="2"/><rect x="1580" y="710" width="285" height="52" fill="#f0f0f0" stroke="#333" stroke-width="2"/><text class="head" x="1722.5" y="743" text-anchor="middle">15. Reports and Analytics</text><text class="body" x="1722.5" y="796" text-anchor="middle">Generate evidence report / PDF</text><text class="body" x="1722.5" y="830" text-anchor="middle">Show progress trends</text><text class="body" x="1722.5" y="864" text-anchor="middle">Share only with consent</text><path d="M1722 450V429H762V446" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="943" y="412" width="455" height="25" fill="white"/><text x="1170" y="431" text-anchor="middle" font-size="18" font-style="italic">Repeat questions and evaluation until completion</text><rect x="60" y="950" width="1805" height="75" fill="#f4f4f4" stroke="#aaa"/><text x="80" y="978" font-size="22" font-weight="bold">Design methodology: Iterative, modular development</text><text x="80" y="1008" font-size="21">Requirements → data and API design → implementation → automated and live verification → refinement.</text></svg>
