<path d="M1336 382V396" stroke="#bd861b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1182" y="400" width="308" height="116" rx="14" fill="#ffffff" stroke="#ead69b" stroke-width="1.5"/>
<rect x="1182" y="400" width="7" height="116" rx="3" fill="#bd861b"/>
