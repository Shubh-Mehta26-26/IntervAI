<text x="824" y="328" class="body">Set topics, question count</text>
<text x="824" y="352" class="body">and starting difficulty</text>
<path d="M960 382V396" stroke="#6c5ac4" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="806" y="400" width="308" height="116" rx="14" fill="#ffffff" stroke="#c6bdf6" stroke-width="1.5"/>
<rect x="806" y="400" width="7" height="116" rx="3" fill="#6c5ac4"/>
<text x="824" y="434" class="cardtitle">Generate questions</text>
<text x="824" y="464" class="body">Role-based technical, project</text>
<text x="824" y="488" class="body">and behavioural prompts</text>
<path d="M960 518V532" stroke="#6c5ac4" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="806" y="536" width="308" height="116" rx="14" fill="#ffffff" stroke="#c6bdf6" stroke-width="1.5"/>
<rect x="806" y="536" width="7" height="116" rx="3" fill="#6c5ac4"/>
<text x="824" y="570" class="cardtitle">Evaluate with RAG</text>
<text x="824" y="600" class="body">Use retrieved sources and</text>
<text x="824" y="624" class="body">six answer dimensions</text>
<path d="M960 654V668" stroke="#6c5ac4" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="806" y="672" width="308" height="116" rx="14" fill="#ffffff" stroke="#c6bdf6" stroke-width="1.5"/>
<rect x="806" y="672" width="7" height="116" rx="3" fill="#6c5ac4"/>
<text x="824" y="706" class="cardtitle">Adapt next question</text>
<text x="824" y="736" class="body">Python policy selects follow-up,</text>
<text x="824" y="760" class="body">topic or difficulty</text>
