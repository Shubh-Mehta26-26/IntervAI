<text x="448" y="488" class="body">and source evidence</text>
<path d="M584 518V532" stroke="#c87442" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="430" y="536" width="308" height="116" rx="14" fill="#ffffff" stroke="#efc5a8" stroke-width="1.5"/>
<rect x="430" y="536" width="7" height="116" rx="3" fill="#c87442"/>
<text x="448" y="570" class="cardtitle">Job analyzer</text>
