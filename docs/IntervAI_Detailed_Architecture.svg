<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">IntervAI detailed architecture diagram</title><desc id="desc">Five-stage architecture: candidate data inputs, processing and context, adaptive interview engine, feedback and growth, and web application. The foundation includes Next.js and FastAPI, PostgreSQL with pgvector and a durable job queue, a background worker, configurable AI and speech providers, and an isolated code runner.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#122145}.title{font-size:43px;font-weight:800}.subtitle{font-size:20px;fill:#516079}.stitle{font-size:24px;font-weight:750}.cardtitle{font-size:20px;font-weight:700}.body{font-size:17px;fill:#3a4762}.footerhead{font-size:22px;font-weight:750}.footerbody{font-size:17px;fill:#3a4762}.num{font-size:21px;font-weight:800;fill:white}.note{font-size:17px;fill:#5d6980}</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334d70"/></marker></defs>
<rect width="1920" height="1080" fill="#f4f6fa"/><rect x="20" y="18" width="1880" height="1044" rx="28" fill="white" stroke="#dce3ee" stroke-width="2"/>
