<text x="448" y="624" class="body">and skill evidence</text>
<path d="M584 654V668" stroke="#c87442" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="430" y="672" width="308" height="116" rx="14" fill="#ffffff" stroke="#efc5a8" stroke-width="1.5"/>
<rect x="430" y="672" width="7" height="116" rx="3" fill="#c87442"/>
<text x="448" y="706" class="cardtitle">Match builder</text>
<text x="448" y="736" class="body">Compare resume with job;</text>
<text x="448" y="760" class="body">show matches and gaps</text>
<path d="M754 520H790" fill="none" stroke="#334d70" stroke-width="3.5" marker-end="url(#arr)"/>
<rect x="794" y="170" width="332" height="648" rx="19" fill="#f1efff" stroke="#c6bdf6" stroke-width="2"/>
<circle cx="828" cy="207" r="22" fill="#6c5ac4"/><text x="828" y="214" class="num" text-anchor="middle">3</text>
<text x="862" y="204" class="stitle">Adaptive Interview</text>
<text x="862" y="231" class="stitle">Engine</text>
<rect x="806" y="264" width="308" height="116" rx="14" fill="#ffffff" stroke="#c6bdf6" stroke-width="1.5"/>
<rect x="806" y="264" width="7" height="116" rx="3" fill="#6c5ac4"/>
