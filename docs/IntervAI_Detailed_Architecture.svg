<rect x="418" y="170" width="332" height="648" rx="19" fill="#fff3eb" stroke="#efc5a8" stroke-width="2"/>
<circle cx="452" cy="207" r="22" fill="#c87442"/><text x="452" y="214" class="num" text-anchor="middle">2</text>
<text x="486" y="204" class="stitle">Processing &amp;</text>
<text x="486" y="231" class="stitle">Context</text>
