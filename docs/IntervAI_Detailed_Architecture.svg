<text x="1200" y="488" class="body">and focused repeat interviews</text>
<path d="M1336 518V532" stroke="#bd861b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1182" y="536" width="308" height="116" rx="14" fill="#ffffff" stroke="#ead69b" stroke-width="1.5"/>
<rect x="1182" y="536" width="7" height="116" rx="3" fill="#bd861b"/>
<text x="1200" y="570" class="cardtitle">Career guidance</text>
<text x="1200" y="600" class="body">Compare roles, explain readiness</text>
<text x="1200" y="624" class="body">and save roadmap choices</text>
<path d="M1336 654V668" stroke="#bd861b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1182" y="672" width="308" height="116" rx="14" fill="#ffffff" stroke="#ead69b" stroke-width="1.5"/>
<rect x="1182" y="672" width="7" height="116" rx="3" fill="#bd861b"/>
<text x="1200" y="706" class="cardtitle">Reports &amp; analytics</text>
<text x="1200" y="736" class="body">Evidence-based PDF reports</text>
<text x="1200" y="760" class="body">and progress trends</text>
<path d="M1506 520H1542" fill="none" stroke="#334d70" stroke-width="3.5" marker-end="url(#arr)"/>
