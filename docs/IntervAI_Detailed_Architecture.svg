<rect x="1558" y="264" width="308" height="116" rx="14" fill="#ffffff" stroke="#a5d4ec" stroke-width="1.5"/>
<rect x="1558" y="264" width="7" height="116" rx="3" fill="#277eaf"/>
<text x="1576" y="298" class="cardtitle">Candidate portal</text>
<text x="1576" y="328" class="body">Profile, resume, jobs,</text>
<text x="1576" y="352" class="body">learning and career pages</text>
<path d="M1712 382V396" stroke="#277eaf" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1558" y="400" width="308" height="116" rx="14" fill="#ffffff" stroke="#a5d4ec" stroke-width="1.5"/>
<rect x="1558" y="400" width="7" height="116" rx="3" fill="#277eaf"/>
<text x="1576" y="434" class="cardtitle">Interview room</text>
<text x="1576" y="464" class="body">Text, voice, coding and</text>
<text x="1576" y="488" class="body">optional camera controls</text>
<path d="M1712 518V532" stroke="#277eaf" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1558" y="536" width="308" height="116" rx="14" fill="#ffffff" stroke="#a5d4ec" stroke-width="1.5"/>
<rect x="1558" y="536" width="7" height="116" rx="3" fill="#277eaf"/>
<text x="1576" y="570" class="cardtitle">Recruiter workspace</text>
<text x="1576" y="600" class="body">Manage jobs; review only</text>
<text x="1576" y="624" class="body">consented applications</text>
<path d="M1712 654V668" stroke="#277eaf" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1558" y="672" width="308" height="116" rx="14" fill="#ffffff" stroke="#a5d4ec" stroke-width="1.5"/>
<rect x="1558" y="672" width="7" height="116" rx="3" fill="#277eaf"/>
<text x="1576" y="706" class="cardtitle">Admin console</text>
<text x="1576" y="736" class="body">System status, user roles</text>
<text x="1576" y="760" class="body">and audit history</text>
<text x="52" y="853" class="footerhead">PLATFORM FOUNDATION</text>
<rect x="42" y="871" width="584" height="141" rx="17" fill="#edf8ff" stroke="#9fd2ee" stroke-width="2"/>
<text x="64" y="910" class="footerhead">Web and API</text>
<text x="64" y="943" class="footerbody">Next.js / React UI → fixed API proxy → FastAPI</text>
<text x="64" y="969" class="footerbody">Sessions, role/owner checks, REST services</text>
<rect x="668" y="871" width="584" height="141" rx="17" fill="#ecf8ef" stroke="#aadbb8" stroke-width="2"/>
<text x="690" y="910" class="footerhead">Data and background jobs</text>
<text x="690" y="943" class="footerbody">PostgreSQL 17 + pgvector; private resume storage</text>
<text x="690" y="969" class="footerbody">Durable job queue and separate worker</text>
<rect x="1294" y="871" width="584" height="141" rx="17" fill="#f1efff" stroke="#c6bdf6" stroke-width="2"/>
<text x="1316" y="910" class="footerhead">Models and isolated execution</text>
<text x="1316" y="943" class="footerbody">Gemini or OpenAI; local Vosk / eSpeak NG</text>
<text x="1316" y="969" class="footerbody">Python, C++ and Java run in a restricted sandbox</text>
<text x="54" y="1045" class="note">The columns show the logical workflow. Users interact through the web application; the browser never accesses the database, provider keys or code runner directly.</text>
</svg>
