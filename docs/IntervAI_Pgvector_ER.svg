lass="field" x="88" y="283">display_name</text><text class="field" x="88" y="316">role</text><rect x="610" y="135" width="420" height="210" fill="#fafcfe" stroke="#53758a" stroke-width="2"/><rect x="610" y="135" width="420" height="49" fill="#e3edf5" stroke="#53758a"/><text class="title" x="628" y="168">candidates</text><text class="field" x="628" y="217">PK  id : UUID</text><text class="field" x="628" y="250">FK  user_id : UUID (unique)</text><text class="field" x="628" y="283">headline</text><text class="field" x="628" y="316">experience_months</text><rect x="1150" y="135" width="420" height="210" fill="#fafcfe" stroke="#53758a" stroke-width="2"/><rect x="1150" y="135" width="420" height="49" fill="#e3edf5" stroke="#53758a"/><text class="title" x="1168" y="168">interviews</text><text class="field" x="1168" y="217">PK  id : UUID</text><text class="field" x="1168" y="250">FK  candidate_id : UUID</text><text class="field" x="1168" y="283">interview_type</text><text class="field" x="1168" y="316">status</text><rect x="70" y="440" width="420" height="240" fill="#fafcfe" stroke="#53758a" stroke-width="2"/><rect x="70" y="440" width="420" height="49" fill="#e3edf5" stroke="#53758a"/><text class="title" x="88" y="473">answer_evaluations</text><text class="field" x="88" y="522">PK  id : UUID</text><text class="field" x="88" y="555">FK  answer_id : UUID (unique)</text><text class="field" x="88" y="588">FK  interview_id : UUID</text><text class="field" x="88" y="621">correctness, relevance, clarity</text><text class="field" x="88" y="654">feedback, grounding_status</text><rect x="610" y="440" width="420" height="240" fill="#fafcfe" stroke="#53758a" stroke-width="2"/><rect x="610" y="440" width="420" height="49" fill="#e3edf5" stroke="#53758a"/><text class="title" x="628" y="473">interview_answers</text><text class="field" x="628" y="522">PK  id : UUID</text><text class="field" x="628" y="555">FK  question_id : UUID (unique)</text><text class="field" x="628" y="588">FK  interview_id, candidate_id</text><text class="field" x="628" y="621">text</text><text class="field" x="628" y="654">status</text><rect x="1150" y="440" width="420" height="240" fill="#fafcfe" stroke="#53758a" stroke-width="2"/><rect x="1150" y="440" width="420" height="49" fill="#e3edf5" stroke="#53758a"/><text class="title" x="1168" y="473">interview_questions</text><text class="field" x="1168" y="522">PK  id : UUID</text><text class="field" x="1168" y="555">FK  interview_id : UUID</text><text class="field" x="1168" y="588">text, topic</text><text class="field" x="1168" y="621">difficulty</text><text class="field" x="1168" y="654">question_type</text><rect x="70" y="760" width="420" height="240" fill="#fafcfe" stroke="#53758a" stroke-width="2"/><rect x="70" y="760" width="420" height="49" fill="#e3edf5" stroke="#53758a"/><text class="title" x="88" y="793">evaluation_sources</text><text class="field" x="88" y="842">PK  id : UUID</text><text class="field" x="88" y="875">FK  evaluation_id : UUID</text><text class="field" x="88" y="908">FK  chunk_id : UUID</text><text class="field" x="88" y="941">similarity, retrieval_rank</text><text class="field" x="88" y="974">relationship, supported_claim</text><rect x="610" y="760" width="420" height="240" fill="#effaf1" stroke="#388054" stroke-width="2"/><rect x="610" y="760" width="420" height="49" fill="#d2ebd8" stroke="#53758a"/><text class="title" x="628" y="793">knowledge_chunks</text><text class="field" x="628" y="842">PK  id : UUID</text><text class="field" x="628" y="875">FK  document_id : UUID</text><text class="field" x="628" y="908">content, ordinal</text><text class="field" x="628" y="941">embedding : vector(1536)</text><text class="field" x="628" y="974">HNSW index / cosine distance</text><rect x="1150" y="760" width="420" height="240" fill="#fafcfe" stroke="#53758a" stroke-width="2"/><rect x="1150" y="760" width="420" height="49" fill="#e3edf5" stroke="#53758a"/><text class="title" x="1168" y="793">knowledge_documents</text><text class="field" x="1168" y="842">PK  id : UUID</text><text class="field" x="1168" y="875">title, source</text><text class="field" x="1168" y="908">domain, topic</text><text class="field" x="1168" y="941">embedding_provider, model</text><text class="field" x="1168" y="974">embedding_dimensions</text><text x="70" y="1055" font-size="22">PK = Primary key   •   FK = Foreign key   •   N = Many   •   0..1 = Optional single record</text><text x="70" y="1090" font-size="21">pgvector is a PostgreSQL extension. Evaluation sources link answer evaluations to retrieved knowledge chunks.</text></svg>