<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">IntervAI core entity relationship diagram</title><desc id="desc">Core database entities and selected relationships for users, candidates, resumes, job descriptions, interviews, questions, answers, evaluations, knowledge chunks, evaluation sources, knowledge gaps and learning plans. Primary keys and foreign keys are shown in each entity.</desc>
