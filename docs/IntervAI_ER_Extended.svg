<rect x="60" y="953" width="1800" height="68" rx="14" fill="#f1f5fa" stroke="#dce4ee"/><text x="84" y="982" class="note">PK = primary key · FK = foreign key · N = many. A candidate can have many analyses, learning plans and reports; each report has versioned snapshots.</text><text x="84" y="1006" class="note">Optional voice and vision sessions are separate from answer grading. Recruiter access depends on a candidate's consented application.</text></svg>
