<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">IntervAI system architecture</title>
  <desc id="desc">Candidate, recruiter, and administrator access a Next.js frontend and fixed API proxy. FastAPI handles authentication, profiles, interviews, career and reports. PostgreSQL with pgvector stores records, evidence, and durable jobs. A separate worker processes AI, speech, and coding jobs. Candidate code runs only in an isolated sandbox. External Gemini or OpenAI providers and local Vosk and eSpeak speech tools connect to the worker.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#142044}
      .title{font-size:40px;font-weight:700}
      .subtitle{font-size:18px;fill:#53617c}
      .h{font-size:23px;font-weight:700}
      .body{font-size:17px;fill:#30405f}
      .small{font-size:15px;fill:#52617a}
      .label{font-size:16px;font-weight:700;fill:#345166}
      .box{stroke-width:2;rx:20}
      .row{stroke:#dbe5ee;stroke-width:1.4}
      .arrow{fill:none;stroke:#2f647b;stroke-width:3.5;marker-end:url(#head)}
      .dashed{stroke-dasharray:10 8}
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f647b"/></marker>
  </defs>
  <rect width="1600" height="980" fill="#f7fafc"/>
  <rect x="32" y="24" width="1536" height="932" rx="28" fill="#fff" stroke="#dbe5ee" stroke-width="2"/>
  <text x="76" y="91" class="title">IntervAI — System Architecture</text>
  <text x="78" y="124" class="subtitle">Adaptive interview and learning platform · deployed with Docker Compose</text>

  <!-- People -->
  <rect class="box" x="70" y="190" width="250" height="340" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="98" y="232" class="h">Users</text>
  <path class="row" d="M95 255H295 M95 345H295 M95 435H295"/>
  <text x="98" y="291" class="body">Candidate</text>
  <text x="98" y="316" class="small">practice and progress</text>
  <text x="98" y="381" class="body">Recruiter</text>
  <text x="98" y="406" class="small">consented applications</text>
  <text x="98" y="471" class="body">Administrator</text>
  <text x="98" y="496" class="small">readiness and audit</text>

  <!-- Frontend -->
  <rect class="box" x="400" y="190" width="285" height="340" fill="#eff9ff" stroke="#76b6d7"/>
  <text x="428" y="232" class="h">Next.js frontend</text>
  <path class="row" d="M425 255H660 M425 345H660 M425 435H660"/>
  <text x="428" y="291" class="body">React + TypeScript UI</text>
  <text x="428" y="316" class="small">desktop and mobile</text>
  <text x="428" y="381" class="body">Interview room</text>
  <text x="428" y="406" class="small">text, voice, code, camera</text>
  <text x="428" y="471" class="body">Fixed API proxy</text>
  <text x="428" y="496" class="small">same-origin requests</text>

  <!-- API -->
  <rect class="box" x="765" y="190" width="355" height="340" fill="#eaf7f2" stroke="#74b9a0"/>
  <text x="793" y="232" class="h">FastAPI application</text>
  <path class="row" d="M790 255H1095 M790 345H1095 M790 435H1095"/>
  <text x="793" y="291" class="body">Auth + role/owner checks</text>
  <text x="793" y="316" class="small">sessions, CSRF, consent</text>
  <text x="793" y="381" class="body">Domain services + REST API</text>
  <text x="793" y="406" class="small">profiles, jobs, interviews, career</text>
  <text x="793" y="471" class="body">Reports + optional vision</text>
  <text x="793" y="496" class="small">PDF, analytics, OpenCV events</text>

  <!-- Storage -->
  <rect class="box" x="1200" y="190" width="330" height="340" fill="#fff7eb" stroke="#e9b66c"/>
  <text x="1228" y="232" class="h">Persistent data</text>
  <path class="row" d="M1225 255H1505 M1225 368H1505"/>
  <text x="1228" y="291" class="body">PostgreSQL + pgvector</text>
  <text x="1228" y="316" class="small">users, evidence, interviews,</text>
  <text x="1228" y="339" class="small">embeddings, durable job queue</text>
  <text x="1228" y="405" class="body">Private file storage</text>
  <text x="1228" y="430" class="small">resumes and local models</text>

  <!-- Worker -->
  <rect class="box" x="765" y="635" width="355" height="235" fill="#eaf7f2" stroke="#74b9a0"/>
  <text x="793" y="677" class="h">Background worker</text>
  <path class="row" d="M790 699H1095"/>
  <text x="793" y="735" class="body">Plans + question generation</text>
  <text x="793" y="768" class="body">RAG evaluation + adaptation</text>
  <text x="793" y="801" class="body">Speech + learning jobs</text>
  <text x="793" y="838" class="small">reads and commits durable jobs</text>

  <!-- Sandbox -->
  <rect class="box" x="400" y="635" width="285" height="235" fill="#fff0f0" stroke="#de8e8e"/>
  <text x="428" y="677" class="h">Isolated code runner</text>
  <path class="row" d="M425 699H660"/>
  <text x="428" y="735" class="body">Python · C++ · Java</text>
  <text x="428" y="768" class="body">Public + hidden tests</text>
  <text x="428" y="805" class="small">resource and network limits</text>
  <text x="428" y="838" class="small">private execution network</text>

  <!-- Providers -->
  <rect class="box" x="1200" y="635" width="330" height="235" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1228" y="677" class="h">AI + speech providers</text>
  <path class="row" d="M1225 699H1505 M1225 779H1505"/>
  <text x="1228" y="735" class="body">Gemini or OpenAI</text>
  <text x="1228" y="760" class="small">LLM + embeddings (configured)</text>
  <text x="1228" y="815" class="body">Vosk + eSpeak NG</text>
  <text x="1228" y="840" class="small">local speech options</text>

  <!-- Data flow -->
  <path class="arrow" d="M320 360H400"/>
  <path class="arrow" d="M685 360H765"/>
  <path class="arrow" d="M1120 360H1200" marker-start="url(#head)"/>
  <text x="344" y="344" class="label">HTTPS</text>
  <text x="704" y="344" class="label">API</text>
  <text x="1137" y="344" class="label">SQL</text>
  <path class="arrow" d="M1365 530V570H1050V635" marker-start="url(#head)"/>
  <text x="1185" y="564" class="label">queued jobs + evidence</text>
  <path class="arrow" d="M1120 752H1200" marker-start="url(#head)"/>
  <text x="1131" y="730" class="label">calls</text>
  <path class="arrow" d="M765 752H685"/>
  <text x="699" y="730" class="label">run</text>

  <text x="78" y="916" class="small">The browser has no direct database, provider-key, or code-runner access. Optional voice and camera features require local configuration and user permission.</text>
</svg>
